<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通用图标风格参考</title><style>
  :root{--navy:#17324d;--blue:#72a6c1;--pale:#dcebf2;--orange:#e57432;--paper:#fbfaf6;--line:#cbd9df;--ink:#2d363c;--muted:#68747b}*{box-sizing:border-box}html,body{margin:0;background:#ddd;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.sheet{width:1100px;padding:44px 48px 40px;background:var(--paper);color:var(--ink)}.eyebrow{color:var(--orange);letter-spacing:4px;font-weight:900;font-size:15px}.title{font-size:38px;color:var(--navy);margin:9px 0 5px}.intro{font-size:16px;color:var(--muted);margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{height:190px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.card:nth-child(4n){border-top-color:var(--navy)}.card:nth-child(n+5){border-top-color:var(--orange);background:#fffaf6}.card b{color:var(--navy);font-size:17px}.icon{width:80px;height:80px}.icon *{vector-effect:non-scaling-stroke}.note{margin-top:20px;border-radius:12px;background:#f4f0e5;padding:14px 18px;color:var(--navy);font-size:15px;line-height:1.6;font-weight:800}.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.rule{padding:12px 14px;border-left:4px solid var(--orange);background:#fff;color:var(--muted);font-size:14px}.rule b{display:block;color:var(--navy);margin-bottom:3px}
</style></head><body><main class="sheet"><div class="eyebrow">通用视觉资产 · 图标规范示意</div><h1 class="title">企业解决方案图标风格参考</h1><p class="intro">以下内容仅用于说明造型、线条、配色和留白方式，不代表任何具体业务方案。</p><div class="grid">
  <div class="card"><svg class="icon" viewBox="0 0 80 80" fill="none"><circle cx="24" cy="25" r="12" fill="#dcebf2" stroke="#17324d" stroke-width="3"/><circle cx="56" cy="25" r="12" fill="#fae9dd" stroke="#17324d" stroke-width="3"/><path d="M10 58c3-12 25-12 28 0M42 58c3-12 25-12 28 0M32 39h16" stroke="#17324d" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="39" r="4" fill="#e57432"/></svg><b>协作沟通</b></div>
  <div class="card"><svg class="icon" viewBox="0 0 80 80" fill="none"><rect x="13" y="12" width="54" height="56" rx="9" fill="#fff" stroke="#17324d" stroke-width="3"/><path d="M25 28h30M25 40h22M25 52h16" stroke="#72a6c1" stroke-width="5" stroke-linecap="round"/><circle cx="57" cy="52" r="8" fill="#e57432"/><path d="m53 52 3 3 5-7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>信息归纳</b></div>
  <div class="card"><svg class="icon" viewBox="0 0 80 80" fill="none"><circle cx="34" cy="34" r="21" fill="#dcebf2" stroke="#17324d" stroke-width="3"/><path d="m49 49 17 17" stroke="#17324d" stroke-width="6" stroke-linecap="round"/><path d="M23 37l7 7 14-18" stroke="#e57432" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>分析判断</b></div>
  <div class="card"><svg class="icon" viewBox="0 0 80 80" fill="none"><rect x="10" y="18" width="60" height="44" rx="8" fill="#fff" stroke="#17324d" stroke-width="3"/><path d="M24 40h32M40 27v26" stroke="#72a6c1" stroke-width="3"/><circle cx="24" cy="40" r="7" fill="#e57432"/><circle cx="56" cy="40" r="7" fill="#17324d"/></svg><b>流程编排</b></div>
  <div class="card"><svg class="icon" viewBox="0 0 80 80" fill="none"><path d="M40 9 65 19v18c0 16-10 27-25 34C25 64 15 53 15 37V19L40 9Z" fill="#dcebf2" stroke="#17324d" stroke-width="3"/><path d="m27 39 8 8 18-21" stroke="#e57432" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>规范校验</b></div>
  <div class="card"><svg class="icon" viewBox="0 0 80 80" fill="none"><rect x="14" y="12" width="52" height="56" rx="8" fill="#fff" stroke="#17324d" stroke-width="3"/><path d="M24 27h32M24 39h32M24 51h18" stroke="#72a6c1" stroke-width="4" stroke-linecap="round"/><circle cx="56" cy="54" r="9" fill="#e57432"/><path d="M56 49v6l4 2" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg><b>过程记录</b></div>
  <div class="card"><svg class="icon" viewBox="0 0 80 80" fill="none"><path d="M16 60V42M31 60V31M46 60V20M61 60V11" stroke="#17324d" stroke-width="9" stroke-linecap="round"/><path d="m13 27 15-9 14 4 22-15" stroke="#e57432" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>成效观察</b></div>
  <div class="card"><svg class="icon" viewBox="0 0 80 80" fill="none"><path d="M18 43a23 23 0 1 1 8 15" stroke="#17324d" stroke-width="5" stroke-linecap="round"/><path d="M17 58V43h15" stroke="#17324d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="m31 40 7 7 13-17" stroke="#e57432" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>持续优化</b></div>
  </div><div class="rules"><div class="rule"><b>造型</b>圆角几何与简化轮廓</div><div class="rule"><b>线条</b>深蓝描边，粗细统一</div><div class="rule"><b>配色</b>浅蓝承托，橙色强调</div><div class="rule"><b>留白</b>透明底图，边界清晰</div></div><div class="note">使用建议：同一张海报中的小图标应保持一致的描边、视觉重量和尺寸关系；具体图标数量与语义由材料决定。</div></main></body></html>
